name: Compilar Instalador Windows

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r packaging/requirements-build.txt
          pip install pytest

      - name: Instalar Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Ejecutar pruebas
        run: pytest tests/ -v

      - name: Compilar instalador
        run: .\packaging\build_windows.ps1
        shell: powershell

      - name: Subir artefacto
        uses: actions/upload-artifact@v7
        with:
          name: OficialiaDigitalDSA-Instalador-Windows
          path: |
            dist/*.exe
            packaging/output/*.exe
          if-no-files-found: error
          retention-days: 14
